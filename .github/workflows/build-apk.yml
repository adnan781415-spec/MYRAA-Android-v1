name: Build MYRAA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract MYRAA package
        run: |
          unzip -q MYRAA-Full-Android-Package.zip -d unpacked
          find unpacked -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \)

      - name: Locate Android project
        id: locate
        run: |
          PROJECT_DIR=$(find unpacked -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project nahi mila."
            echo "ZIP ke andar ki files aur folder structure check karo."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
